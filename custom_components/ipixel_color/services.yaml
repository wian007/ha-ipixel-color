display_text:
  name: Display text
  description: Show text on a panel or combined display.
  fields:
    device_id:
      name: Display
      description: Target panel or combined display (optional when only one is configured)
      required: false
      selector:
        device:
          integration: ipixel_color
    entity_id:
      name: Entity
      description: Any entity of the target display (alternative to device)
      required: false
      selector:
        entity:
          integration: ipixel_color
    text:
      name: Text
      description: Text to display (templates and \n are supported)
      required: true
      example: "Hello World"
      selector:
        text:
    mode:
      name: Mode
      description: text = rendered by the panel itself (scroll/blink effects); textimage = rendered by Home Assistant (spread over a combined display)
      required: false
      default: "text"
      selector:
        select:
          options:
            - "text"
            - "textimage"
    effect:
      name: Animation
      description: Native text animation (0 static, 1 scroll left, 2 scroll right, 3 up, 4 down, 5 blink, 6 fade, 7 snow)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    speed:
      name: Speed
      description: Animation speed (0-100)
      required: false
      default: 80
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    rainbow_mode:
      name: Rainbow
      description: Rainbow colour mode (0-9)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    color_fg:
      name: Text colour
      description: Text colour
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    color_bg:
      name: Background colour
      description: Background colour
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    font:
      name: Font
      description: UNIFONT (built-in) or a font file name from the fonts folder
      required: false
      example: "UNIFONT"
      selector:
        text:
    font_size:
      name: Font size
      description: Character height in pixels (0 = automatic)
      required: false
      selector:
        number:
          min: 0
          max: 128
          mode: box
          unit_of_measurement: "px"

update_display:
  name: Update display
  description: Re-render the current entity settings (text, mode, colours, ...) to the display.
  fields:
    device_id:
      name: Display
      description: Target panel or combined display (optional when only one is configured)
      required: false
      selector:
        device:
          integration: ipixel_color
    entity_id:
      name: Entity
      description: Any entity of the target display (alternative to device)
      required: false
      selector:
        entity:
          integration: ipixel_color

display_image_url:
  name: Display image from URL
  description: Download a PNG/JPG/BMP/WEBP/GIF and show it (spread over a combined display).
  fields:
    device_id:
      name: Display
      description: Target panel or combined display (optional when only one is configured)
      required: false
      selector:
        device:
          integration: ipixel_color
    entity_id:
      name: Entity
      description: Any entity of the target display (alternative to device)
      required: false
      selector:
        entity:
          integration: ipixel_color
    url:
      name: Image URL
      description: URL of the image or GIF
      required: true
      example: "https://example.com/image.png"
      selector:
        text:
    effect:
      name: Effect
      description: Optional image effect (blur, invert, mirror, ...)
      required: false
      selector:
        text:
    buffer_slot:
      name: Storage slot
      description: Store in a slot (1-255) instead of showing directly (0)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

upload_gif:
  name: Upload GIF
