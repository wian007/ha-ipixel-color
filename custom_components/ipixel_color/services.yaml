    entity_id:
      name: Entity
      description: Any entity of the target display (alternative to device)
      required: false
      selector:
        entity:
          integration: ipixel_color
    image_path:
      name: Image path
      description: Path to the image (must be in allowlist_external_dirs)
      required: true
      example: "/config/www/images/display.png"
      selector:
        text:
    brightness:
      name: Brightness
      description: Scale the pixel values (1-100)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

