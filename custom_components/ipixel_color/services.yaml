display_image_raw_rgb:
  name: Display image (raw RGB)
  description: Stream an image file from disk using the fast raw RGB protocol (not stored on the panel).
  fields:
    device_id:
      name: Display
      description: Target panel or combined display (optional when only one is configured)
      required: false
      selector:
