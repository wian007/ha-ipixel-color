draw_visuals:
  name: Draw visuals
  description: Render multiple elements (text, scrolling text, long text, images, pixels) with animation on the whole display.
  fields:
    device_id:
      name: Display
      description: Target panel or combined display (optional when only one is configured)
      required: false
      selector:
        device:
          integration: ipixel_color
    entity_id:
      name: Entity
      description: Any entity of the target display (alternative to device)
      required: false
      selector:
        entity:
          integration: ipixel_color
    elements:
      name: Elements
      description: "List of elements. Types - text (content, x, y, color, font, font_size), textscroll (content, y, speed), textlong (content, x, y, speed, direction), image (source, x, y, width, height), pixels (data: [{x, y, color}])"
      required: true
      example: |
        - type: text
          content: "Hello"
          x: 0
          y: 0
          color: "ffffff"
        - type: textscroll
          content: "Scrolling message..."
          y: 8
          speed: 50
      selector:
        object:
    background:
      name: Background
      description: Background colour
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    fps:
      name: FPS
      description: Animation frames per second (1-30)
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: slider
    brightness:
      name: Brightness
      description: Scale the pixel values (1-100)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

