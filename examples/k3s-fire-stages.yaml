# Flames on a 2x2 iPIXEL wall whose height follows the CPU usage of a k3s
# cluster. The sensor comes from examples/k3s-node-metrics (metrics-server ->
# MQTT -> Home Assistant); the GIFs from tools/generate_fire_gifs.py.
#
# 1. Render the animations into the Home Assistant media folder:
#        python tools/generate_fire_gifs.py /media/fire
# 2. Deploy examples/k3s-node-metrics so sensor.k3s_cpu exists.
# 3. Call this service once (Developer tools > Actions, YAML mode). The
#    thresholds are percentages of the allocatable cores; stage 0 below 15 %,
#    stage 4 above 70 %.
action: ipixel_color.set_stages
target:
  entity_id: camera.combined_display_voorbeeld
data:
  stages:
    - media-source://media_source/local/fire/fire_0.gif
    - media-source://media_source/local/fire/fire_1.gif
    - media-source://media_source/local/fire/fire_2.gif
    - media-source://media_source/local/fire/fire_3.gif
    - media-source://media_source/local/fire/fire_4.gif
  source: sensor.k3s_cpu
  thresholds: "15, 30, 50, 70"
  base_slot: 10
