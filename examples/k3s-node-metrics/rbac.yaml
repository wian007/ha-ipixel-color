apiVersion: v1
kind: Namespace
metadata:
  name: ha-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-node-metrics
  namespace: ha-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-node-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-node-metrics
subjects:
  - kind: ServiceAccount
    name: k3s-node-metrics
    namespace: ha-metrics
