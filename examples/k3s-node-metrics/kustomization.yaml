apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ha-metrics
resources:
  - rbac.yaml
  - deployment.yaml
configMapGenerator:
  - name: k3s-node-metrics
    files:
      - metrics.py
secretGenerator:
  - name: k3s-node-metrics-mqtt
    envs:
      - mqtt.env
generatorOptions:
  disableNameSuffixHash: true
