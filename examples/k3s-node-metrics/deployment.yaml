apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-node-metrics
  namespace: ha-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3s-node-metrics
  template:
    metadata:
      labels:
        app: k3s-node-metrics
    spec:
      serviceAccountName: k3s-node-metrics
      containers:
        - name: metrics
          image: python:3.13-alpine
          command: ["python", "-u", "/app/metrics.py"]
          envFrom:
            - secretRef:
                name: k3s-node-metrics-mqtt
          env:
            - name: INTERVAL
              value: "10"
            - name: CLUSTER_NAME
              value: "k3s"
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: script
          configMap:
            name: k3s-node-metrics
