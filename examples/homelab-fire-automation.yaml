# Flames on a 2x2 iPIXEL wall whose height follows a load metric.
#
# 1. Render the animations:  python tools/generate_fire_gifs.py /media/fire
#    (the media folder of Home Assistant, so they appear in the media browser)
# 2. Adjust the entity and the five thresholds below to your metric
#    (here: total power draw of the homelab in watts).
# 3. Paste this automation (Settings > Automations > three dots > Edit in YAML).
#
# Only a change of class triggers an upload (a GIF takes a few seconds to
# reach four panels through a Bluetooth proxy); the wall starts the animation
# on all panels together and keeps them in step.
alias: "iPIXEL wall: homelab flames"
description: Flame height follows the homelab power draw (5 classes).
mode: restart
triggers:
  - trigger: state
    entity_id: sensor.homelab_totaal_vermogen
  - trigger: homeassistant
    event: start
variables:
  level: >-
    {% set w = states('sensor.homelab_totaal_vermogen') | float(0) %}
    {% if w < 120 %}0{% elif w < 200 %}1{% elif w < 280 %}2{% elif w < 360 %}3{% else %}4{% endif %}
  from_level: >-
    {% set s = trigger.from_state.state if trigger.from_state is defined and trigger.from_state else 'x' %}
    {% set w = s | float(-1) %}
    {% if w < 0 %}-1{% elif w < 120 %}0{% elif w < 200 %}1{% elif w < 280 %}2{% elif w < 360 %}3{% else %}4{% endif %}
conditions:
  - condition: template
    value_template: "{{ level | int != from_level | int }}"
actions:
  - action: ipixel_color.display_image
    target:
      entity_id: camera.combined_display_voorbeeld
    data:
      url: "media-source://media_source/local/fire/fire_{{ level }}.gif"
